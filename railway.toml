[build]
builder = "RAILPACK"
buildCommand = "pnpm turbo run build --filter=@tiles-town/api"
watchPatterns = [
  "/apps/api/**",
  "/packages/game-core/**",
  "/packages/contracts/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/railway.toml",
  "/tsconfig.base.json",
  "/tsconfig.json",
  "/turbo.json"
]

[deploy]
startCommand = "pnpm --filter @tiles-town/api start"
preDeployCommand = "pnpm --filter @tiles-town/api db:migrate:dist"
healthcheckPath = "/api/health-check"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
