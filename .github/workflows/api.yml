name: API

on:
    push:
        branches:
            - master
        paths:
            - 'apps/api/**'
            - 'packages/contracts/**'
            - 'docker-compose.yml'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'railway.toml'
            - 'tsconfig.base.json'
            - 'tsconfig.json'
            - 'turbo.json'
            - 'README.md'
    pull_request:
        paths:
            - 'apps/api/**'
            - 'packages/contracts/**'
            - 'docker-compose.yml'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'railway.toml'
            - 'tsconfig.base.json'
            - 'tsconfig.json'
            - 'turbo.json'
            - 'README.md'

concurrency:
    group: api-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    api:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.7.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: docker compose up -d postgres
            - run: |
                  for i in {1..30}; do
                    if docker compose exec -T postgres pg_isready -U postgres -d tiles-town; then
                      exit 0
                    fi
                    sleep 1
                  done
                  exit 1
              shell: bash
            - run: pnpm --filter @tiles-town/contracts run build
            - run: pnpm --filter @tiles-town/api run lint
            - run: pnpm --filter @tiles-town/api run typecheck
            - run: pnpm --filter @tiles-town/api run test
            - run: pnpm --filter @tiles-town/api run build
            - run: docker compose up -d --build api
            - run: curl --fail --retry 20 --retry-delay 3 http://127.0.0.1:4200/api/health-check
