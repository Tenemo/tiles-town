services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        ports:
            - 5434:5432
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: tiles-town
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d tiles-town']
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 5s
        volumes:
            - tiles-town-postgres:/var/lib/postgresql/data

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - 4200:4200
        environment:
            NODE_ENV: production
            PORT: 4200
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/tiles-town
            DATABASE_SSL: false
            CORS_ALLOWED_ORIGINS: http://127.0.0.1:3200,http://localhost:3200
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:4200/api/health-check').then((response) => { if (!response.ok) { process.exit(1); } }).catch(() => process.exit(1));",
                ]
            interval: 5s
            timeout: 5s
            retries: 24
            start_period: 10s

volumes:
    tiles-town-postgres:
